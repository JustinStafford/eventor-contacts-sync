[project]
name = "eventor-contacts-sync"
version = "0.1.0"
description = "Keep Google Contacts in sync with an orienteering club's Eventor members and event entrants."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Justin Stafford" }]
dependencies = [
  "eventor-mailchimp-sync",
  "google-auth>=2.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "typer>=0.12",
]

[project.scripts]
eventor-contacts-sync = "eventor_contacts_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventor_contacts_sync"]

[tool.hatch.metadata]
allow-direct-references = true

# The Eventor API client (eventor_client) ships inside eventor-mailchimp-sync; pin it to a commit
# so the nightly sync only changes when the pin moves.
[tool.uv.sources]
eventor-mailchimp-sync = { git = "https://github.com/JustinStafford/eventor-mailchimp-sync", rev = "bb40004aa7ec5fa0815539bfdb194a81ee620cce" }

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "PIE", "ISC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:eventor_contacts_sync"]
